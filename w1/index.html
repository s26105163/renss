<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片 - Kartu Nama Digital</title>
    
    <!-- 引入 Google Fonts 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- 引入 Font Awesome Library (ntuk Ikon IG & Email) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 連結外部 CSS 檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片主體 (置中卡片) -->
    <main class="card">
        
        <!-- 1. 圓形大頭貼照片 -->
        <div class="avatar-wrapper">
            <img class="avatar" src="https://i.postimg.cc/QCjV84gb/unnamed.jpg" alt="大頭貼照片">
        </div>

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">陳永豪</h1>
        <p class="bio">靜水流深。</p>

        <!-- 3. 按鈕區塊 (Instagram & Email) -->
        <div class="button-group">
            <!-- Tombol Instagram dengan ikon -->
            <a href="https://www.instagram.com/rendyychnn_?stkn=MWRnOWZzNjA5NXk2bA%3D%3D&utm_source=qr" target="_blank" class="btn btn-instagram">
                <i class="fa-brands fa-instagram btn-icon"></i>
                <span>Instagram</span>
            </a>
            
         <!-- Tombol Email dengan ikon -->
<a href="mailto:s26105163@stu.edu.tw" class="btn btn-email">
    <i class="fa-regular fa-envelope btn-icon"></i>
    <span>Email</span>
            </a>
        </div>

    </main>

</body>
</html>
